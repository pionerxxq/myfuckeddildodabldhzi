<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Garmonia Launcher</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; height: 100vh; width: 100vw; 
    background: url('https://i.pinimg.com/736x/a6/56/a1/a656a1d0e692c6180a6c3a6d213590f8.jpg') center/cover no-repeat;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: white; overflow: hidden; user-select: none;
    display: flex; flex-direction: column;
  }
  
  /* КАСТОМНЫЙ HEADER */
  .title-bar {
    height: 40px; background: rgba(10, 10, 10, 0.98);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 15px; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .title-bar-text { font-size: 13px; font-weight: 600; color: #888; pointer-events: none; }
  .window-controls { display: flex; gap: 5px; }
  .win-btn {
    width: 32px; height: 28px; border: none; background: transparent; color: #aaa;
    font-size: 14px; cursor: pointer; border-radius: 6px; transition: 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .win-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .win-btn.close:hover { background: #ef4444; color: #fff; }

  /* КОНТЕНТ */
  .content-wrapper { flex: 1; position: relative; display: flex; overflow: hidden; }
  .overlay { position: absolute; inset: 0; background: rgba(15, 15, 20, 0.65); backdrop-filter: blur(3px); z-index: 1; }
  
  .launcher-box {
    position: relative; z-index: 2; width: 100%; height: 100%; display: flex; overflow: hidden;
  }
  
  /* Левая панель */
  .login-panel { 
    width: 350px; padding: 30px; background: rgba(10, 10, 10, 0.95); 
    display: flex; flex-direction: column; justify-content: space-between; 
    border-right: 1px solid rgba(255,255,255,0.05);
  }
  .login-top { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  
  .logo { font-size: 32px; font-weight: 900; color: #38bdf8; margin-bottom: 30px; text-align: center; letter-spacing: 2px; text-shadow: 0 0 20px rgba(56,189,248,0.3); }
  .form-group { margin-bottom: 15px; }
  input {
    width: 100%; padding: 14px; background: #161616; border: 1px solid #333;
    border-radius: 10px; color: white; font-size: 14px; outline: none; transition: 0.3s;
  }
  input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.2); }
  .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 15px; }
  .btn-login { background: #38bdf8; color: #000; margin-top: 10px; }
  .btn-login:hover { background: #0ea5e9; }
  .error { color: #ef4444; font-size: 13px; margin-top: 10px; text-align: center; display: none; }

  .login-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #666; border-top: 1px solid #222; padding-top: 15px; }
  .login-footer a { color: #888; text-decoration: none; transition: color 0.2s; }
  .login-footer a:hover { color: #38bdf8; }

  /* Правая панель */
  .main-panel { flex: 1; padding: 30px; display: flex; flex-direction: column; position: relative; overflow-y: auto; }
  .news-title { font-size: 22px; font-weight: 700; margin-bottom: 15px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
  
  .news-box { flex: 1; min-height: 120px; background: rgba(17, 17, 17, 0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; overflow-y: auto; font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 15px; backdrop-filter: blur(5px); }
  .news-box b { color: #fff; }

  /* Блок настроек */
  .settings-box { 
    background: rgba(17, 17, 17, 0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
    padding: 15px 20px; margin-bottom: 20px; display: grid; grid-template-columns: 120px 150px 1fr; gap: 15px; backdrop-filter: blur(5px);
  }
  .setting-item { display: flex; flex-direction: column; gap: 8px; }
  .setting-item label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; white-space: nowrap; }
  
  select, .folder-input {
    width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #444;
    border-radius: 8px; color: white; font-size: 13px; outline: none;
  }
  select:focus, .folder-input:focus { border-color: #38bdf8; }
  
  .folder-group { display: flex; gap: 8px; }
  .btn-small { padding: 10px 15px; background: #333; border: 1px solid #555; color: #fff; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 600; white-space: nowrap; }
  .btn-small:hover { background: #38bdf8; color: #000; border-color: #38bdf8; }

  .quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
  .quick-btn {
    background: rgba(17, 17, 17, 0.85); border: 1px solid rgba(255,255,255,0.1); color: #ccc; text-decoration: none;
    display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: 8px;
    font-size: 13px; font-weight: 600; transition: all 0.2s; backdrop-filter: blur(5px);
  }
  .quick-btn:hover { background: rgba(34, 34, 34, 0.9); border-color: #38bdf8; color: #38bdf8; }

  .bottom-area { display: flex; flex-direction: column; align-items: center; }
  .progress-container { width: 100%; height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; margin-bottom: 15px; overflow: hidden; display: none; }
  .progress-bar { height: 100%; width: 0%; background: #38bdf8; transition: width 0.3s; box-shadow: 0 0 10px #38bdf8; }
  .btn-play {
    width: 100%; background: #22c55e; color: #000; font-size: 18px; padding: 16px; border-radius: 12px;
    font-weight: 900; letter-spacing: 1px; box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); display: none; border: none; cursor: pointer;
  }
  .btn-play:hover { background: #16a34a; }
  .status-text { font-size: 13px; color: #ccc; margin-top: 10px; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

  .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #38bdf8; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; margin: 0 auto; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="title-bar" id="title-bar">
    <div class="title-bar-text">Garmonia Launcher</div>
    <div class="window-controls">
      <button class="win-btn" onclick="minimizeApp()">—</button>
      <button class="win-btn close" onclick="closeApp()">✕</button>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="overlay"></div>
    <div class="launcher-box">
      
      <div class="login-panel" id="login-panel">
        <div class="login-top">
          <div class="logo">GARMONIA</div>
          <div class="form-group"><input type="text" id="username" placeholder="Логин"></div>
          <div class="form-group"><input type="password" id="password" placeholder="Пароль"></div>
          <button class="btn btn-login" id="login-btn" onclick="login()">Войти</button>
          <div class="spinner" id="login-spinner"></div>
          <div class="error" id="login-error"></div>
        </div>
        <div class="login-footer">
          <a href="https://garmoniadlc.up.railway.app" target="_blank">Сайт</a>
          <a href="https://discord.com/app" target="_blank">Discord</a>
          <span class="version">v1.0.4</span>
        </div>
      </div>

      <div class="main-panel" id="main-panel" style="display: none;">
        <div class="news-title">Привет, <span id="user-name" style="color:#38bdf8"></span>!</div>
        
        <div class="quick-links">
          <a href="https://garmoniadlc.up.railway.app" target="_blank" class="quick-btn">Личный кабинет</a>
          <a href="https://garmoniadlc.up.railway.app/#pricing" target="_blank" class="quick-btn">Купить подписку</a>
        </div>

        <div class="news-box">
          <b>📢 Обновление 1.0.4</b><br>
          - Оптимизация рендера.<br>
          - Новые плащи и косметика.<br><br>
          <i style="color:#888;">Выберите настройки и нажмите "Играть".</i>
        </div>

        <!-- БЛОК НАСТРОЕК -->
        <div class="settings-box">
          <div class="setting-item">
            <label>Версия</label>
            <select id="version-select">
              <option value="1.21.11 Fabric" selected>1.21.11 Fabric</option>
            </select>
          </div>
          <div class="setting-item">
            <label>RAM</label>
            <select id="ram-select">
              <option value="2048">2 GB</option>
              <option value="4096" selected>4 GB</option>
              <option value="6144">6 GB</option>
              <option value="8192">8 GB</option>
              <option value="16384">16 GB</option>
            </select>
          </div>
          <div class="setting-item">
            <label>Папка установки</label>
            <div class="folder-group">
              <input type="text" id="install-path" class="folder-input" value="C:\Games\Garmonia" readonly>
              <button class="btn-small" onclick="selectFolder()">Обзор</button>
            </div>
          </div>
        </div>
        
        <div class="bottom-area">
          <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <button class="btn btn-play" id="play-btn" onclick="playGame()">ИГРАТЬ</button>
          <div class="status-text" id="status-text">Система готова к запуску</div>
        </div>
      </div>

    </div>
  </div>

<script>
let myHwid = "UNKNOWN";

// Функция загрузки сохраненных настроек при запуске
window.addEventListener('DOMContentLoaded', () => {
  const savedPath = localStorage.getItem('garmonia_path');
  if (savedPath) document.getElementById('install-path').value = savedPath;

  const savedRam = localStorage.getItem('garmonia_ram');
  if (savedRam) document.getElementById('ram-select').value = savedRam;

  const savedVersion = localStorage.getItem('garmonia_version');
  if (savedVersion) document.getElementById('version-select').value = savedVersion;
});

// Сохраняем RAM при изменении
document.getElementById('ram-select').addEventListener('change', (e) => {
  localStorage.setItem('garmonia_ram', e.target.value);
});

// Сохраняем версию при изменении
document.getElementById('version-select').addEventListener('change', (e) => {
  localStorage.setItem('garmonia_version', e.target.value);
});

if (window.chrome && window.chrome.webview) {
  document.getElementById('title-bar').addEventListener('mousedown', (e) => {
    if (e.target.tagName !== 'BUTTON') {
      window.chrome.webview.postMessage("DRAG");
    }
  });

  window.chrome.webview.addEventListener('message', event => {
    if (event.data.startsWith("HWID:")) myHwid = event.data.split(":")[1];
    
    // Ловим выбранную папку от C# и сохраняем её в память
    if (event.data.startsWith("FOLDER_SELECTED:")) {
      const newPath = event.data.replace("FOLDER_SELECTED:", "");
      document.getElementById('install-path').value = newPath;
      localStorage.setItem('garmonia_path', newPath); // <--- СОХРАНЯЕМ ПАПКУ
    }
  });
  window.chrome.webview.postMessage("GET_HWID");
}

function minimizeApp() { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage("MINIMIZE"); }
function closeApp() { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage("CLOSE"); }

function selectFolder() {
  if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage("SELECT_FOLDER");
  else alert("Выбор папки доступен только в лаунчере!");
}

async function login() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const err = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  const spinner = document.getElementById('login-spinner');

  if (!u || !p) { err.innerText = "Введите логин и пароль"; err.style.display = 'block'; return; }

  btn.style.display = 'none'; spinner.style.display = 'block'; err.style.display = 'none';

  try {
    const hwidToSend = myHwid === "UNKNOWN" ? "TEST_HWID_BROWSER" : myHwid;
    const res = await fetch('/api/client/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p, hwid: hwidToSend })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error);

    document.getElementById('login-panel').style.display = 'none';
    document.getElementById('main-panel').style.display = 'flex';
    document.getElementById('user-name').innerText = u;
    document.getElementById('play-btn').style.display = 'block';

  } catch (e) {
    err.innerText = e.message; err.style.display = 'block';
    btn.style.display = 'block'; spinner.style.display = 'none';
  }
}

function playGame() {
  const btn = document.getElementById('play-btn');
  const bar = document.getElementById('progress-bar');
  const container = document.getElementById('progress-container');
  const status = document.getElementById('status-text');

  const selectedVersion = document.getElementById('version-select').value;
  const selectedRam = document.getElementById('ram-select').value;
  const installPath = document.getElementById('install-path').value;

  btn.style.display = 'none';
  container.style.display = 'block';
  status.innerText = 'Проверка файлов...';

  let progress = 0;
  const interval = setInterval(() => {
    progress += Math.floor(Math.random() * 15) + 5;
    if (progress > 100) progress = 100;
    bar.style.width = progress + '%';

    if (progress >= 100) {
      clearInterval(interval);
      status.innerText = 'Запуск клиента...';
      
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(`START_MINECRAFT|${selectedVersion}|${selectedRam}|${installPath}`);
      } else {
        alert("Играть можно только через GarmoniaLauncher.exe!");
      }
    }
  }, 200);
}
</script>
</body>
</html>
