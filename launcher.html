<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Garmonia Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #050810;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-light-blue: #38bdf8;
    --accent-blue: #3b82f6;
    --accent-cyan: #06b6d4;
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-hover: rgba(255, 255, 255, 0.06);
    --font-body: 'Inter', sans-serif;
    --font-heading: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    height: 100vh; width: 100vw; 
    background: url('https://i.pinimg.com/736x/a6/56/a1/a656a1d0e692c6180a6c3a6d213590f8.jpg') center/cover no-repeat;
    font-family: var(--font-body); 
    color: var(--text-main); overflow: hidden; user-select: none;
    display: flex; flex-direction: column;
  }
  
  /* --- КАСТОМНЫЙ HEADER --- */
  .title-bar {
    height: 40px; background: rgba(5, 8, 16, 0.8); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 15px; z-index: 100; border-bottom: 1px solid var(--glass-border);
  }
  .title-bar-text { font-size: 13px; font-weight: 600; color: var(--text-muted); pointer-events: none; font-family: var(--font-heading); }
  .window-controls { display: flex; gap: 5px; }
  .win-btn {
    width: 32px; height: 28px; border: none; background: transparent; color: var(--text-muted);
    font-size: 14px; cursor: pointer; border-radius: 6px; transition: 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .win-btn:hover { background: var(--glass-hover); color: #fff; }
  .win-btn.close:hover { background: #ef4444; color: #fff; }

  /* --- ОСНОВНОЙ КОНТЕНТ --- */
  .content-wrapper { flex: 1; position: relative; display: flex; overflow: hidden; }
  .overlay { position: absolute; inset: 0; background: rgba(5, 8, 16, 0.75); backdrop-filter: blur(8px); z-index: 1; }
  
  .launcher-box {
    position: relative; z-index: 2; width: 100%; height: 100%; display: flex; overflow: hidden;
  }
  
  /* --- ЛЕВАЯ ПАНЕЛЬ (ЛОГИН) --- */
  .login-panel { 
    width: 350px; padding: 30px; background: rgba(5, 8, 16, 0.85); 
    display: flex; flex-direction: column; justify-content: space-between; 
    border-right: 1px solid var(--glass-border); backdrop-filter: blur(20px);
  }
  .login-top { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  
  .logo { 
    font-family: var(--font-heading); font-size: 32px; font-weight: 700; 
    background: linear-gradient(to right, var(--accent-light-blue), var(--accent-blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 30px; text-align: center; letter-spacing: 1px;
  }
  
  .form-group { margin-bottom: 15px; }
  input {
    width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
    border-radius: 12px; color: white; font-size: 14px; outline: none; transition: 0.3s; font-family: var(--font-body);
  }
  input:focus { border-color: var(--accent-light-blue); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
  
  .btn { 
    width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; 
    cursor: pointer; transition: 0.3s; font-size: 15px; font-family: var(--font-body);
  }
  .btn-login { background: #fff; color: #000; margin-top: 10px; }
  .btn-login:hover { background: #e2e8f0; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
  
  .error { color: #ef4444; font-size: 13px; margin-top: 10px; text-align: center; display: none; font-weight: 500; }

  /* Спиннер загрузки (добавил, так как в твоем коде не было стилей) */
  .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin: 15px auto 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--glass-border); padding-top: 15px; }
  .login-footer a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .login-footer a:hover { color: var(--accent-light-blue); }

  /* --- ПРАВАЯ ПАНЕЛЬ (ЛАУНЧЕР) --- */
  .main-panel { flex: 1; padding: 30px; display: flex; flex-direction: column; position: relative; overflow-y: auto; }
  .news-title { font-family: var(--font-heading); font-size: 24px; font-weight: 700; margin-bottom: 20px; color: #fff; }
  .news-title span { color: var(--accent-light-blue); }
  
  .news-box { 
    flex: 1; min-height: 120px; background: var(--glass-bg); border: 1px solid var(--glass-border); 
    border-radius: 16px; padding: 20px; overflow-y: auto; font-size: 14px; color: var(--text-muted); 
    line-height: 1.6; margin-bottom: 20px; backdrop-filter: blur(10px); 
  }
  .news-box b { color: #fff; font-family: var(--font-heading); }

  .settings-box { 
    background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; 
    padding: 20px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 150px; gap: 20px; backdrop-filter: blur(10px);
  }
  .setting-item { display: flex; flex-direction: column; gap: 8px; }
  .setting-item label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; white-space: nowrap; }
  
  select, .folder-input {
    width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
    border-radius: 10px; color: white; font-size: 13px; outline: none; font-family: var(--font-body);
  }
  select:focus, .folder-input:focus { border-color: var(--accent-light-blue); }
  
  .folder-group { display: flex; gap: 8px; }
  .btn-small { 
    padding: 0 16px; background: var(--glass-hover); border: 1px solid var(--glass-border); color: #fff; 
    border-radius: 10px; cursor: pointer; transition: 0.2s; font-weight: 600; white-space: nowrap; font-family: var(--font-body);
  }
  .btn-small:hover { background: var(--accent-light-blue); color: #000; border-color: var(--accent-light-blue); }

  .quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  .quick-btn {
    background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); text-decoration: none;
    display: flex; align-items: center; justify-content: center; padding: 14px; border-radius: 12px;
    font-size: 13px; font-weight: 600; transition: all 0.2s; backdrop-filter: blur(10px); font-family: var(--font-body);
  }
  .quick-btn:hover { background: var(--glass-hover); border-color: var(--accent-light-blue); color: var(--accent-light-blue); }

  .bottom-area { display: flex; flex-direction: column; align-items: center; margin-top: auto; }
  .progress-container { width: 100%; height: 8px; background: rgba(0,0,0,0.4); border-radius: 4px; margin-bottom: 15px; overflow: hidden; display: none; border: 1px solid var(--glass-border); }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-light-blue)); transition: width 0.3s; box-shadow: 0 0 15px var(--accent-light-blue); }
  
  .btn-download {
    width: 100%; background: #f59e0b; color: #000; font-size: 16px; padding: 16px; border-radius: 14px;
    font-weight: 700; display: none; border: none; cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-family: var(--font-heading);
  }
  .btn-download:hover { background: #d97706; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3); }

  .btn-play {
    width: 100%; background: #fff; color: #000; font-size: 18px; padding: 18px; border-radius: 14px;
    font-weight: 700; letter-spacing: 1px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); display: none; border: none; cursor: pointer; transition: 0.3s; font-family: var(--font-heading);
  }
  .btn-play:hover { background: #e2e8f0; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(56, 189, 248, 0.4); }
  
  .status-text { font-size: 13px; color: var(--text-muted); margin-top: 12px; font-weight: 500; }
</style>
</head>
<body>

  <!-- КАСТОМНЫЙ ХЕДЕР -->
  <div class="title-bar" id="title-bar">
    <div class="title-bar-text">Garmonia Launcher</div>
    <div class="window-controls">
      <button class="win-btn" onclick="minimizeApp()">—</button>
      <button class="win-btn close" onclick="closeApp()">✕</button>
    </div>
  </div>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <div class="content-wrapper">
    <div class="overlay"></div>
    <div class="launcher-box">
      
      <!-- ПАНЕЛЬ ВХОДА -->
      <div class="login-panel" id="login-panel">
        <div class="login-top">
          <div class="logo">GARMONIA</div>
          <div class="form-group"><input type="text" id="username" placeholder="Логин"></div>
          <div class="form-group"><input type="password" id="password" placeholder="Пароль"></div>
          <button class="btn btn-login" id="login-btn" onclick="login()">Войти</button>
          <div class="spinner" id="login-spinner"></div>
          <div class="error" id="login-error"></div>
        </div>
        <div class="login-footer">
          <a href="https://garmoniadlc.up.railway.app" target="_blank">Сайт</a>
          <a href="https://discord.com/app" target="_blank">Discord</a>
          <span class="version">v1.0.4</span>
        </div>
      </div>

      <!-- ПАНЕЛЬ ИГРЫ -->
      <div class="main-panel" id="main-panel" style="display: none;">
        <div class="news-title">Привет, <span id="user-name"></span>!</div>
        
        <div class="quick-links">
          <a href="https://garmoniadlc.up.railway.app" target="_blank" class="quick-btn">Личный кабинет</a>
          <a href="https://garmoniadlc.up.railway.app/#pricing" target="_blank" class="quick-btn">Купить подписку</a>
        </div>

        <div class="news-box">
          <b>GarmoniaDLC — лучший выбор</b><br>
          - Хорошие визуалы.<br>
          - Отличный PvP функционал.<br><br>
          <i style="color:#888;">Скачайте клиент (если не скачан) и нажмите "Играть".</i>
        </div>

        <div class="settings-box">
          <div class="setting-item">
            <label>Папка установки (1.21.11)</label>
            <div class="folder-group">
              <input type="text" id="install-path" class="folder-input" value="D:\GarmAntiLeak\clients\Garmonia\1.21.11\" readonly>
              <button class="btn-small" onclick="selectFolder()">Обзор</button>
            </div>
          </div>
          <div class="setting-item">
            <label>RAM</label>
            <select id="ram-select">
              <option value="2048">2 GB</option>
              <option value="4096" selected>4 GB</option>
              <option value="6144">6 GB</option>
              <option value="8192">8 GB</option>
              <option value="16384">16 GB</option>
            </select>
          </div>
        </div>
        
        <div class="bottom-area">
          <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          
          <button class="btn btn-download" id="download-btn" onclick="downloadGame()">СКАЧАТЬ КЛИЕНТ</button>
          <button class="btn btn-play" id="play-btn" onclick="playGame()">ИГРАТЬ</button>
          
          <div class="status-text" id="status-text">Система готова к запуску</div>
        </div>
      </div>

    </div>
  </div>

<script>
let myHwid = "UNKNOWN";

// Загрузка сохраненных настроек при старте
window.addEventListener('DOMContentLoaded', () => {
  const savedPath = localStorage.getItem('garmonia_path');
  if (savedPath) document.getElementById('install-path').value = savedPath;
  
  const savedRam = localStorage.getItem('garmonia_ram');
  if (savedRam) document.getElementById('ram-select').value = savedRam;
});

// Сохраняем RAM при изменении
document.getElementById('ram-select').addEventListener('change', (e) => localStorage.setItem('garmonia_ram', e.target.value));

// Обмен сообщениями с C#
if (window.chrome && window.chrome.webview) {
  document.getElementById('title-bar').addEventListener('mousedown', (e) => {
    if (e.target.tagName !== 'BUTTON') window.chrome.webview.postMessage("DRAG");
  });

  window.chrome.webview.addEventListener('message', event => {
    const msg = event.data;
    
    if (msg.startsWith("HWID:")) myHwid = msg.split(":")[1];
    
    if (msg.startsWith("FOLDER_SELECTED:")) {
      const newPath = msg.replace("FOLDER_SELECTED:", "");
      document.getElementById('install-path').value = newPath;
      localStorage.setItem('garmonia_path', newPath);
    }
    
    // Прогресс скачивания (реальный)
    if (msg.startsWith("PROGRESS:")) {
      const percent = parseInt(msg.split(":")[1]);
      if (!isNaN(percent)) {
        document.getElementById('progress-bar').style.width = percent + '%';
      }
    }
    
    // Текст статуса
    if (msg.startsWith("STATUS:")) {
      document.getElementById('status-text').innerText = msg.split(":")[1];
    }
    
    // Установка завершена
    if (msg === "INSTALL_SUCCESS") {
      document.getElementById('status-text').innerText = "Установка завершена!";
      document.getElementById('progress-bar').style.width = '100%';
      setTimeout(() => {
        document.getElementById('download-btn').style.display = 'block';
        document.getElementById('progress-container').style.display = 'none';
        document.getElementById('progress-bar').style.width = '0%';
      }, 2000);
    }
    
    // Ошибка установки/запуска
    if (msg === "INSTALL_ERROR") {
      document.getElementById('status-text').innerText = "Ошибка";
      document.getElementById('download-btn').style.display = 'block';
      document.getElementById('play-btn').style.display = 'block';
      document.getElementById('progress-container').style.display = 'none';
      document.getElementById('progress-bar').style.width = '0%';
    }
    
    // Игра успешно запущена
    if (msg === "LAUNCH_SUCCESS") {
      document.getElementById('status-text').innerText = "Игра запущена!";
      document.getElementById('progress-container').style.display = 'none';
      document.getElementById('progress-bar').style.width = '0%';
    }

    // Игра закрыта (возвращаем кнопку)
    if (msg === "GAME_EXITED") {
      document.getElementById('status-text').innerText = "Игра закрыта. Можно запускать снова.";
      document.getElementById('play-btn').style.display = 'block';
      document.getElementById('progress-container').style.display = 'none';
      document.getElementById('progress-bar').style.width = '0%';
    }
  });
  
  window.chrome.webview.postMessage("GET_HWID");
}

// Управление окном
function minimizeApp() { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage("MINIMIZE"); }
function closeApp() { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage("CLOSE"); }

// Выбор папки
function selectFolder() {
  if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage("SELECT_FOLDER");
}

// Авторизация (ОСТАВЛЕН ТВОЙ КОД)
async function login() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const err = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  const spinner = document.getElementById('login-spinner');

  if (!u || !p) { err.innerText = "Введите логин и пароль"; err.style.display = 'block'; return; }
  btn.style.display = 'none'; spinner.style.display = 'block'; err.style.display = 'none';

  try {
    const hwidToSend = myHwid === "UNKNOWN" ? "TEST_HWID_BROWSER" : myHwid;
    const res = await fetch('/api/client/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p, hwid: hwidToSend })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error);

    document.getElementById('login-panel').style.display = 'none';
    document.getElementById('main-panel').style.display = 'flex';
    document.getElementById('user-name').innerText = u;
    
    document.getElementById('download-btn').style.display = 'block';
    document.getElementById('play-btn').style.display = 'block';

  } catch (e) {
    err.innerText = e.message; err.style.display = 'block';
    btn.style.display = 'block'; spinner.style.display = 'none';
  }
}

// Скачивание (ОСТАВЛЕН ТВОЙ КОД)
async function downloadGame() {
  const path = document.getElementById('install-path').value;
  const container = document.getElementById('progress-container');
  const status = document.getElementById('status-text');

  document.getElementById('download-btn').style.display = 'none';
  container.style.display = 'block';
  status.innerText = 'Получение ссылки...';
  document.getElementById('progress-bar').style.width = '0%';

  try {
    const res = await fetch('/api/client/mod_url');
    const data = await res.json();
    
    if (!data.url) throw new Error("Ссылка на мод не настроена на сервере.");

    status.innerText = 'Подготовка к скачиванию...';
    
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(`DOWNLOAD_MINECRAFT|${path}|${data.url}`);
    }
  } catch (e) {
    status.innerText = 'Ошибка';
    alert(e.message);
    document.getElementById('download-btn').style.display = 'block';
    container.style.display = 'none';
  }
}

// Запуск игры (ОСТАВЛЕН ТВОЙ КОД)
function playGame() {
  const btn = document.getElementById('play-btn');
  const container = document.getElementById('progress-container');
  const status = document.getElementById('status-text');

  const selectedRam = document.getElementById('ram-select').value;
  const installPath = document.getElementById('install-path').value;
  const playerName = document.getElementById('user-name').innerText;

  btn.style.display = 'none';
  container.style.display = 'block';
  document.getElementById('progress-bar').style.width = '10%';
  status.innerText = 'Запуск клиента...';
  
  if (window.chrome && window.chrome.webview) {
    // Отправляем ник в C#
    window.chrome.webview.postMessage(`START_MINECRAFT|1.21.11 Fabric|${selectedRam}|${installPath}|${playerName}`);
  } else {
    alert("Играть можно только через GarmoniaLauncher.exe!");
  }
}
</script>
</body>
</html>
